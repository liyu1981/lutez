name: ci

on:
  push:
  pull_request:

env:
  ZIG_VERSION: 0.17.0

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: tools/upstream.sh --verify

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src test samples
      - run: zig build check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: zig build wasm
      - run: node test/wasm/smoke.mjs

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe
      - run: zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe
      - run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
      # The parity job (Go differential + corpus regen) is added in M0.5 together
      # with parity/go, and checks out submodules recursively.
