name: ci

on:
  push:
  pull_request:

env:
  ZIG_VERSION: 0.17.0

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: tools/upstream.sh --verify

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src test samples
      - run: zig build check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: zig build wasm
      - run: node test/wasm/smoke.mjs

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: cd .. && zig build wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:fast
      - run: pnpm check
      - run: pnpm check:links

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: tools/build-release.sh --skip-tests --clean
      - uses: actions/upload-artifact@v4
        with:
          name: lutez-dist
          path: dist/
          if-no-files-found: error
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: tools/upstream.sh --verify
      - run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe
      - name: L2 differential + L3 HTML oracle + dual fuzz + schema
        run: |
          cd parity/go
          CC="zig cc" go run ./cmd/diff --dashboard
          CC="zig cc" go run ./cmd/html-oracle
          CC="zig cc" go run ./cmd/fuzz -n 2000
          go run ./cmd/check-schema
      - run: cd parity/go && go run ./cmd/gencorpus --gfm-spec ../../upstream/lute/test/gfm-spec.md
      - run: cd parity/go && go run ./cmd/bench
      - name: corpus is reproducible
        run: git diff --exit-code test/corpus
